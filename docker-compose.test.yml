services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consulting_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consulting_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - consulting_pgdata_test:/var/lib/postgresql/data

volumes:
  consulting_pgdata_test:
